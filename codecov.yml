# Three CI jobs upload coverage (unit-test, dhcp-plugin-test, branching-test); report only after all arrive.
codecov:
  notify:
    after_n_builds: 3

comment:
  after_n_builds: 3
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

coverage:
  status:
    patch:
      default:
        # New code should be well covered, but the default `auto` target pins the
        # patch threshold to the project's overall coverage (~98%), which a feature
        # PR can't hit once unavoidable defensive/edge branches are counted. A fixed
        # floor keeps a meaningful gate without failing on a couple of uncovered lines.
        target: 90%
        threshold: 1%

# All other coverage settings live in pyproject's [tool.coverage.*] tables.
