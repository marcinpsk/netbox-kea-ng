{
  "Dhcp4": {
    "interfaces-config": {"interfaces": []},
    "control-sockets": [{"socket-type": "http", "socket-address": "0.0.0.0", "socket-port": 8000}],
    "lease-database": {"type": "memfile", "persist": false},
    "hooks-libraries": [
      {"library": "/usr/lib/kea/hooks/libdhcp_pgsql.so"},
      {"library": "/usr/lib/kea/hooks/libdhcp_lease_cmds.so"},
      {"library": "/usr/lib/kea/hooks/libdhcp_stat_cmds.so"},
      {"library": "/usr/lib/kea/hooks/libdhcp_host_cmds.so"},
      {"library": "/usr/lib/kea/hooks/libdhcp_subnet_cmds.so"}
    ],
    "client-classes": [
      {"name": "voip"},
      {"name": "printers", "only-in-additional-list": true, "valid-lifetime": 4000, "boot-file-name": "global.efi"},
      {
        "name": "boot",
        "test": "option[93].hex == 0x0007",
        "only-if-required": true,
        "next-server": "192.0.2.5",
        "server-hostname": "boot.example.org",
        "boot-file-name": "pxelinux.0",
        "valid-lifetime": 600,
        "min-valid-lifetime": 300,
        "max-valid-lifetime": 900,
        "option-def": [{"name": "boot-flag", "code": 231, "space": "dhcp4", "type": "uint8", "comment": "Class definition"}],
        "option-data": [{"name": "boot-flag", "data": "1", "comment": "Class option"}],
        "user-context": {"owner": "provisioning"}
      },
      {"name": "per-client", "template-test": "substring(option[61].hex, 0, 3)"}
    ],
    "option-def": [
      {"name": "tftp-list", "code": 224, "space": "dhcp4", "type": "ipv4-address", "array": true},
      {"name": "vendor-record", "code": 225, "space": "dhcp4", "type": "record", "record-types": "uint8, string"},
      {"name": "vendor-container", "code": 226, "space": "dhcp4", "type": "empty", "encapsulate": "vendor-sub"},
      {"name": "sub-one", "code": 1, "space": "vendor-sub", "type": "string"}
    ],
    "option-data": [
      {"name": "domain-name-servers", "data": "192.0.2.53, 192.0.2.54"},
      {"code": 42, "data": "192.0.2.123", "always-send": true},
      {"name": "domain-name", "data": "example.org", "never-send": false},
      {"name": "tftp-list", "data": "192.0.2.69, 192.0.2.70"},
      {"name": "vendor-record", "data": "1, hello"},
      {"name": "sub-one", "space": "vendor-sub", "data": "nested"},
      {"name": "vendor-container"},
      {"name": "routers", "data": "192.0.2.1", "client-classes": ["voip"]},
      {"code": 150, "data": "C0000245", "csv-format": false}
    ],
    "comment": "Coverage configuration",
    "adaptive-lease-time-threshold": 0.8,
    "cache-max-age": 20,
    "offer-lifetime": 30,
    "min-valid-lifetime": 3500,
    "max-valid-lifetime": 4500,
    "reservations": [{"client-id": "01:aa:bb:cc:00:02:00", "hostname": "global-host"}],
    "valid-lifetime": 4000,
    "next-server": "192.0.2.1",
    "server-hostname": "global.example.org",
    "boot-file-name": "global.efi",
    "renew-timer": 1000,
    "rebind-timer": 2000,
    "ddns-qualifying-suffix": "dhcp.example.com",
    "subnet4": [
      {
        "id": 10,
        "user-context": {"comment": "Standalone", "site": "hq"},
        "reservations-in-subnet": false,
        "subnet": "192.0.2.0/24",
        "pools": [
          {"pool": "192.0.2.64/26"},
          {
            "pool": "192.0.2.10 - 192.0.2.20",
            "pool-id": 7,
            "client-classes": ["voip"],
            "evaluate-additional-classes": ["printers"],
            "ddns-send-updates": true,
            "ddns-generated-prefix": "pool",
            "hostname-char-set": "[^A-Za-z0-9.-]",
            "hostname-char-replacement": "x",
            "user-context": {"rack": "r1"},
            "option-data": [{"name": "domain-name", "data": "pool.example.org"}]
          }
        ],
        "option-data": [{"name": "routers", "data": "192.0.2.1"}],
        "valid-lifetime": 3600,
        "min-valid-lifetime": 1800,
        "max-valid-lifetime": 7200,
        "offer-lifetime": 60,
        "renew-timer": 900,
        "rebind-timer": 1800,
        "allocator": "random",
        "ddns-qualifying-suffix": "",
        "ddns-send-updates": true,
        "ddns-override-no-update": false,
        "ddns-override-client-update": false,
        "ddns-replace-client-name": "never",
        "ddns-generated-prefix": "myhost",
        "ddns-update-on-renew": false,
        "ddns-conflict-resolution-mode": "check-with-dhcid",
        "ddns-ttl-percent": 0.5,
        "ddns-ttl-min": 300,
        "ddns-ttl-max": 900,
        "hostname-char-set": "[^A-Za-z0-9.-]",
        "hostname-char-replacement": "",
        "client-classes": ["voip"],
        "evaluate-additional-classes": ["printers"],
        "relay": {"ip-addresses": ["198.51.100.1"]},
        "interface": "eth0"
      }
    ],
    "shared-networks": [
      {
        "name": "office",
        "ddns-qualifying-suffix": "office.example.net",
        "reservations-global": true,
        "comment": "Office floors",
        "interface": "eth0",
        "relay": {"ip-addresses": ["198.51.100.2", "198.51.100.3"]},
        "option-data": [{"code": 6, "data": "198.51.100.53"}],
        "subnet4": [
          {"id": 20, "subnet": "198.51.100.0/25", "pools": [{"pool": "198.51.100.10 - 198.51.100.50"}]},
          {
            "id": 21,
            "subnet": "198.51.100.128/25",
            "ddns-qualifying-suffix": "office.example.org.",
            "reservations-out-of-pool": true,
            "ddns-ttl": 600,
            "client-class": "voip",
            "require-client-classes": ["printers"],
            "comment": "Second floor",
            "pools": [
              {
                "pool": "198.51.100.200 - 198.51.100.220",
                "ddns-qualifying-suffix": "pool.example.org",
                "client-class": "voip",
                "require-client-classes": ["printers"],
                "comment": "Second floor pool"
              }
            ],
            "reservations": [
              {
                "hw-address": "aa:bb:cc:00:01:00",
                "ip-address": "198.51.100.240",
                "hostname": "boot-host",
                "next-server": "192.0.2.5",
                "server-hostname": "boot.example.org",
                "boot-file-name": "host.efi",
                "client-classes": ["voip"],
                "option-data": [{"name": "domain-name", "data": "host.example.org"}],
                "user-context": {"asset": 42}
              }
            ]
          }
        ]
      },
      {
        "name": "empty-network",
        "user-context": {"owner": "noc", "comment": ["first line", "second line"]},
        "client-class": "voip",
        "require-client-classes": ["printers"]
      }
    ]
  }
}
