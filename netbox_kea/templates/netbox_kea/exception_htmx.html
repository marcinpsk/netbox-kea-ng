{# section_id names the section that a Refresh swaps, so the error stays on the page. #}
<div {% if section_id %}id="{{ section_id }}" {% endif %}class="container-fluid">
  <div class="row">
    <div class="col col-md-6 offset-md-3">
      <div class="card border-danger mt-5">
        <h5 class="card-header"><i class="mdi mdi-alert me-1"></i> Server Error</h5>
        <div class="card-body">
          An internal error occurred. Reference ID: <code>{{ error_id }}</code>
        </div>
      </div>
    </div>
  </div>
</div>
