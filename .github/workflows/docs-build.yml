---
name: Docs build

# Builds the documentation site with screenshots and recordings of the commit it checks out. docs.yml deploys the
# result for a release tag, and ci.yml runs it on release pull requests and in the scheduled run.
"on":
  workflow_call:
    inputs:
      ref:
        description: The ref to check out. Empty checks out the commit of the calling event.
        type: string
        default: ""
      upload-pages:
        description: Upload the site as the GitHub Pages artifact. Otherwise upload it as a workflow artifact.
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The docs variant lets Kea persist its configuration, so the clips show no config-write failure.
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml:docker-compose.docs.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      # The black-box test client, as in the integration job of ci.yml. Zensical needs Python 3.11 or later.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      # --with-deps runs apt-get update; Playwright brings its own Chromium, so drop the Chrome source first.
      - name: Ensure playwright browsers are installed
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          uv run --native-tls playwright install --with-deps

      - name: Run uv build
        run: uv build --native-tls

      - name: Run test_setup.sh
        run: ./tests/test_setup.sh
        env:
          NETBOX_CONTAINER_TAG: v4.7

      # imageio-ffmpeg in the dev group brings the ffmpeg that encodes the recordings, so no apt package is needed.
      - name: Capture the documentation screenshots and recordings
        run: |
          uv run --native-tls pytest tests/docs_media -p no:django --tracing=retain-on-failure -v \
            --docs-media-dir docs/guide/assets

      # The build does not fail on a missing image or video, so the check reads the pages that it wrote.
      - name: Build the documentation site
        run: uv run --native-tls --group docs zensical build --strict

      - name: Check the screenshots and recordings on the built pages
        run: uv run --native-tls python scripts/check_docs_media.py site docs/guide/assets

      - name: Upload the site for GitHub Pages
        if: ${{ inputs.upload-pages }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/

      - name: Upload the site
        if: ${{ !inputs.upload-pages }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docs-site
          path: site/
          retention-days: 14

      # test-results/ also holds the raw WebM of each recording.
      - name: Upload Playwright traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright-traces-docs
          path: test-results/
          retention-days: 90

      - name: Show Docker logs
        if: ${{ always() }}
        run: docker compose logs
        working-directory: ./tests/docker/
