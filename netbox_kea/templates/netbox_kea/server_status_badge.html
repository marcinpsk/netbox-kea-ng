{% for s in statuses %}
  <span class="badge {% if s.online %}text-bg-success{% else %}text-bg-danger{% endif %} me-1"
        title="{{ server.name }}">
    DHCPv{{ s.version }}
    {% if s.online %}Online{% else %}Offline{% endif %}
  </span>
{% endfor %}
