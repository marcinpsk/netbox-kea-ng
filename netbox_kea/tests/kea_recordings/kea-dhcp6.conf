{
  "Dhcp6": {
    "interfaces-config": {"interfaces": []},
    "control-sockets": [{"socket-type": "http", "socket-address": "0.0.0.0", "socket-port": 8000}],
    "lease-database": {"type": "memfile", "persist": false},
    "hooks-libraries": [
      {"library": "/usr/lib/kea/hooks/libdhcp_pgsql.so"},
      {"library": "/usr/lib/kea/hooks/libdhcp_lease_cmds.so"},
      {"library": "/usr/lib/kea/hooks/libdhcp_stat_cmds.so"},
      {"library": "/usr/lib/kea/hooks/libdhcp_host_cmds.so"},
      {"library": "/usr/lib/kea/hooks/libdhcp_subnet_cmds.so"}
    ],
    "client-classes": [
      {"name": "voip"},
      {"name": "printers", "only-in-additional-list": true, "valid-lifetime": 4000, "preferred-lifetime": 3000},
      {
        "name": "boot",
        "test": "option[15].hex == 0x0007",
        "only-if-required": true,
        "preferred-lifetime": 500,
        "min-preferred-lifetime": 250,
        "max-preferred-lifetime": 750,
        "valid-lifetime": 600,
        "min-valid-lifetime": 300,
        "max-valid-lifetime": 900,
        "option-data": [{"name": "preference", "data": "20", "comment": "Class option"}],
        "user-context": {"owner": "provisioning"}
      },
      {"name": "per-client", "template-test": "substring(option[1].hex, 0, 3)"}
    ],
    "option-def": [
      {"name": "tftp-list", "code": 1000, "space": "dhcp6", "type": "ipv6-address", "array": true},
      {"name": "vendor-record", "code": 1001, "space": "dhcp6", "type": "record", "record-types": "uint16, string"},
      {"name": "vendor-container", "code": 1002, "space": "dhcp6", "type": "empty", "encapsulate": "vendor-sub"},
      {"name": "sub-one", "code": 1, "space": "vendor-sub", "type": "string", "comment": "Vendor sub-option"},
      {"name": "unused-flag", "code": 250, "space": "dhcp6", "type": "uint8", "comment": "No option uses it"}
    ],
    "option-data": [
      {"name": "dns-servers", "data": "2001:db8::53, 2001:db8::54"},
      {"code": 31, "data": "2001:db8::123", "always-send": true},
      {"name": "domain-search", "data": "example.org", "never-send": false},
      {"name": "tftp-list", "data": "2001:db8::69"},
      {"name": "vendor-record", "data": "1, hello"},
      {"name": "sub-one", "space": "vendor-sub", "data": "nested"},
      {"name": "vendor-container"},
      {"name": "preference", "data": "10", "client-classes": ["voip"]},
      {"name": "preference", "data": "5"},
      {"code": 1003, "data": "C0000245", "csv-format": false}
    ],
    "comment": "Coverage configuration",
    "adaptive-lease-time-threshold": 0.8,
    "cache-max-age": 20,
    "reservations": [{"hw-address": "aa:bb:cc:00:02:01", "hostname": "global-host"}],
    "preferred-lifetime": 3000,
    "min-preferred-lifetime": 2500,
    "max-preferred-lifetime": 3500,
    "min-valid-lifetime": 3500,
    "max-valid-lifetime": 4500,
    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000,
    "ddns-qualifying-suffix": "dhcp.example.com",
    "subnet6": [
      {
        "id": 10,
        "user-context": {"comment": "Standalone", "site": "hq"},
        "reservations-in-subnet": false,
        "subnet": "2001:db8:1::/64",
        "pools": [
          {
            "pool": "2001:db8:1::10 - 2001:db8:1::ff",
            "pool-id": 7,
            "client-classes": ["voip"],
            "evaluate-additional-classes": ["printers"],
            "ddns-send-updates": true,
            "ddns-generated-prefix": "pool",
            "hostname-char-set": "[^A-Za-z0-9.-]",
            "hostname-char-replacement": "x",
            "user-context": {"rack": "r1"},
            "option-data": [{"name": "domain-search", "data": "pool.example.org"}]
          },
          {"pool": "2001:db8:1:0:1::/80"}
        ],
        "pd-pools": [
          {
            "prefix": "2001:db8:100::",
            "prefix-len": 48,
            "delegated-len": 56,
            "excluded-prefix": "2001:db8:100:ff::",
            "excluded-prefix-len": 64,
            "pool-id": 3,
            "client-classes": ["voip"],
            "evaluate-additional-classes": ["printers"],
            "user-context": {"rack": "r2"},
            "option-data": [{"name": "dns-servers", "data": "2001:db8:100::53"}]
          },
          {"prefix": "2001:db8:200::", "prefix-len": 48, "delegated-len": 64}
        ],
        "option-data": [{"name": "dns-servers", "data": "2001:db8:1::53"}],
        "preferred-lifetime": 1800,
        "min-preferred-lifetime": 900,
        "max-preferred-lifetime": 3600,
        "valid-lifetime": 3600,
        "min-valid-lifetime": 1800,
        "max-valid-lifetime": 7200,
        "renew-timer": 900,
        "rebind-timer": 1800,
        "allocator": "random",
        "pd-allocator": "flq",
        "ddns-qualifying-suffix": "",
        "ddns-send-updates": true,
        "ddns-override-no-update": false,
        "ddns-override-client-update": false,
        "ddns-replace-client-name": "never",
        "ddns-generated-prefix": "myhost",
        "ddns-update-on-renew": false,
        "ddns-conflict-resolution-mode": "check-with-dhcid",
        "ddns-ttl-percent": 0.5,
        "ddns-ttl-min": 300,
        "ddns-ttl-max": 900,
        "hostname-char-set": "[^A-Za-z0-9.-]",
        "hostname-char-replacement": "",
        "client-classes": ["voip"],
        "evaluate-additional-classes": ["printers"],
        "relay": {"ip-addresses": ["2001:db8:ffff::1"]},
        "interface-id": "port-7"
      }
    ],
    "shared-networks": [
      {
        "name": "office",
        "ddns-qualifying-suffix": "office.example.net",
        "reservations-global": true,
        "comment": "Office floors",
        "interface": "eth0",
        "relay": {"ip-addresses": ["2001:db8:ffff::2"]},
        "option-data": [{"code": 23, "data": "2001:db8:2::53"}],
        "subnet6": [
          {"id": 20, "subnet": "2001:db8:2::/64", "pools": [{"pool": "2001:db8:2::10 - 2001:db8:2::50"}]},
          {
            "id": 21,
            "subnet": "2001:db8:3::/64",
            "ddns-qualifying-suffix": "office.example.org.",
            "reservations-out-of-pool": true,
            "ddns-ttl": 600,
            "client-class": "voip",
            "require-client-classes": ["printers"],
            "comment": "Second floor",
            "pools": [
              {
                "pool": "2001:db8:3::100 - 2001:db8:3::1ff",
                "ddns-qualifying-suffix": "pool.example.org",
                "client-class": "voip",
                "require-client-classes": ["printers"],
                "comment": "Second floor pool"
              }
            ],
            "pd-pools": [
              {
                "prefix": "2001:db8:300::",
                "prefix-len": 48,
                "delegated-len": 64,
                "client-class": "voip",
                "require-client-classes": ["printers"],
                "comment": "Second floor delegated prefixes"
              }
            ],
            "reservations": [
              {
                "duid": "00:01:00:01:2c:4f:00:01:aa:bb:cc:00:01:00",
                "ip-addresses": ["2001:db8:3::300"],
                "prefixes": ["2001:db8:400:100::/56"],
                "excluded-prefixes": ["2001:db8:400:100:ff::/80"],
                "hostname": "boot-host",
                "client-classes": ["voip"],
                "option-data": [{"name": "dns-servers", "data": "2001:db8:3::53"}],
                "user-context": {"asset": 42}
              }
            ]
          }
        ]
      },
      {
        "name": "empty-network",
        "user-context": {"owner": "noc", "comment": ["first line", "second line"]},
        "client-class": "voip",
        "require-client-classes": ["printers"]
      }
    ]
  }
}
