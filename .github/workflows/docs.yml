---
name: Docs

# A push to main is a release merge here, so each one rebuilds the site and its screenshots.
"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A queued run waits, so a deployment that started always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/docs-build.yml
    with:
      upload-pages: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
