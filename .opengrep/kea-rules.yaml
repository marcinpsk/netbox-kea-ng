#
# Custom opengrep ruleset encoding the project's AGENTS.md security/correctness
# invariants. The local pre-commit hook runs these rules through
# scripts/opengrep-scan.sh.
#
# Rule-test fixtures live in .opengrep/tests/; run them with scripts/opengrep-test.sh.
rules:
  - id: kea-row-return-url-empty-fallback
    languages: [python]
    severity: ERROR
    message: >-
      A row's `return_url` is assigned from `safe_return_url()` with an empty fallback. Give row action
      return URLs the current request path as their fallback. An empty fallback loses the list query after a
      mutation or cancellation. Limit: the rule checks this direct assignment only; it does not follow aliases
      or intermediate values.
    paths:
      exclude:
        - "**/tests/**"
    pattern: $ROW["return_url"] = safe_return_url($REQUEST, "")

  - id: kea-queryset-model-attribute-discriminator
    languages: [python]
    severity: ERROR
    message: >-
      A `model` attribute check distinguishes a queryset from a model instance. Use `isinstance()` with
      `QuerySet`. A model instance can also have a `model` attribute, because a model field can use the same
      name.
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    pattern-either:
      - pattern: hasattr($OBJECT, "model")
      - pattern: getattr($OBJECT, "model", type($OBJECT))

  - id: kea-config-phase-without-reply-validation
    languages: [python]
    severity: ERROR
    message: >-
      A direct config-test, config-set or config-write call bypasses the single-reply validation. Send
      config-test and config-write through `_one_command()`, and config-set through
      `_config_mutation_command()`, so each phase requires one well-formed reply before it accepts a result
      code.
    paths:
      exclude:
        - "**/tests/**"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $CLIENT.command(KeaCommand.$M, ...)
              - pattern: $CLIENT.command(..., command=KeaCommand.$M, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^CONFIG_(TEST|SET|WRITE)$
      - pattern: $CLIENT._one_command(KeaCommand.CONFIG_SET, ...)

  - id: kea-sync-hostname-unpublished
    languages: [python]
    severity: ERROR
    message: >-
      A `.hostname` of a lease, Reservation or record is passed as a call argument or in a `(hardware,
      hostname)` pair, and not to `lease_published_name()`. The IPAM and MAC sync must report the name that
      Kea publishes, so both sources agree. Pass a lease hostname through `lease_published_name()` and a
      Reservation through `reservation_published_name()` in `netbox_kea/published_name.py`. Limits: the rule
      matches receiver names that end in `lease`, `reservation` or `record`, and it does not follow a hostname
      through a local variable.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "https://github.com/marcinpsk/netbox-kea/issues/304"
    paths:
      include:
        - "netbox_kea/ipam_reconciliation.py"
        - "netbox_kea/integrations/dhcp_import_reservations.py"
        - "kea-sync-hostname-unpublished.py"
    patterns:
      # A reported name reaches the sync as a call argument or in a (hardware, hostname) pair.
      - pattern-either:
          - pattern: $FUNCTION(..., $RECORD.hostname, ...)
          - pattern: ($HARDWARE, $RECORD.hostname)
      - metavariable-regex:
          metavariable: $RECORD
          regex: (?i)(lease|reservation|record)$
      - pattern-not: lease_published_name(...)

  - id: kea-get-client-missing-version
    languages: [python]
    severity: WARNING
    message: >-
      Pass an explicit DHCP version to `server.get_client(version=...)` when the version is known. On dual-URL
      servers, a call without `version=` can reach the wrong daemon. A call that is deliberately
      version-agnostic passes `version=None`.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "CLAUDE.md: Always pass version= to server.get_client()"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern: $X.get_client()

  - id: kea-client-outside-with
    languages: [python]
    severity: ERROR
    message: >-
      A Kea client holds a `requests.Session`, so it lives for one operation (#239). Build it as the item of a
      `with` (`with server.get_client(version=family) as client:`), or through a holder that closes it:
      `change_outcome.build_client()` in a `with`, `views/_base.LazyClient`,
      `lease_reservation_reads.WorkerClients`, or the context managers `views/_base.client_or_refusal()` and
      `subnet_catalogue._catalogue_client()`. A lambda that `attempt()` runs becomes a local function with the
      `with` block. A `build_client()` call (bare or as a module attribute) must also be the item of a `with`.
      Limits: the holders are exempt by name, and the rule does not check how a caller uses `LazyClient`,
      `WorkerClients` or a context manager holder; a second call with the same receiver (or, for
      `build_client()`, the same arguments) inside the block of such a `with` is not seen; a reference that is
      not called, such as `partial(server.get_client)`, is not seen.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "AGENTS.md: a Kea client lives for one operation"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    pattern-either:
      - patterns:
          - pattern: $S.get_client($...ARGS)
          - pattern-not-inside: |
              with $S.get_client($...ARGS) as $C:
                ...
          - pattern-not-inside: |
              with $S.get_client($...ARGS):
                ...
          - pattern-not-inside: |
              def build_client(...):
                ...
          - pattern-not-inside: |
              def _catalogue_client(...):
                ...
          - pattern-not-inside: |
              def client_or_refusal(...):
                ...
          - pattern-not-inside: |
              class LazyClient:
                ...
          - pattern-not-inside: |
              class WorkerClients:
                ...
      # build_client() returns the client, so its caller must close it.
      - patterns:
          - pattern-either:
              - pattern: build_client($...ARGS)
              - pattern: $M.build_client($...ARGS)
          - pattern-not-inside: |
              with build_client($...ARGS) as $C:
                ...
          - pattern-not-inside: |
              with $M.build_client($...ARGS) as $C:
                ...
          - pattern-not-inside: |
              with build_client($...ARGS):
                ...
          - pattern-not-inside: |
              with $M.build_client($...ARGS):
                ...

  - id: kea-exception-detail-in-response
    languages: [python]
    severity: ERROR
    message: >-
      Do not leak exception details to user-facing responses or a job log. `str(exc)` or an f-string that
      interpolates a caught exception, in `messages.*`, an HTTP or DRF response or the `self.logger` job log
      of a JobRunner, can expose internal URLs, TLS details or the Kea API configuration. Log server-side with
      `logger.exception()` and return a generic message (or `kea_error_message()`, which shows the reply text
      of Kea). In a job log, log `type(exc).__name__`.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - "CWE-209: Generation of Error Message Containing Sensitive Information"
      owasp:
        - "A09:2021 - Security Logging and Monitoring Failures"
      references:
        - "CLAUDE.md: Never leak exception details to HTTP responses"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-inside: |
          try:
              ...
          except $EXC as $E:
              ...
      - pattern-either:
          - pattern: messages.error($REQ, str($E), ...)
          - pattern: messages.warning($REQ, str($E), ...)
          - pattern: messages.info($REQ, str($E), ...)
          - pattern: messages.error($REQ, f"...{$E}...", ...)
          - pattern: messages.warning($REQ, f"...{$E}...", ...)
          - pattern: messages.info($REQ, f"...{$E}...", ...)
          - pattern: HttpResponse(str($E), ...)
          - pattern: HttpResponse(f"...{$E}...", ...)
          - pattern: HttpResponseBadRequest(str($E), ...)
          - pattern: HttpResponseBadRequest(f"...{$E}...", ...)
          - pattern: HttpResponseServerError(str($E), ...)
          - pattern: HttpResponseServerError(f"...{$E}...", ...)
          - pattern: JsonResponse(str($E), ...)
          - pattern: Response(str($E), ...)
          - pattern: Response(f"...{$E}...", ...)
          # A JobRunner's job log is shown in the NetBox UI and the REST API.
          - pattern: self.logger.$LEVEL(str($E), ...)
          - pattern: self.logger.$LEVEL(f"...{$E}...", ...)
          - pattern: self.logger.$LEVEL(f"...{$E}..." "...", ...)

  - id: kea-command-result-indexed-without-guard
    languages: [python]
    severity: ERROR
    message: >-
      Do not index a Kea command result directly (`client.command(...)[0]`). `command()` only guarantees a
      list; an empty or malformed payload makes `[0]` raise `IndexError` or `TypeError`. Assign the result and
      validate its shape before you index it: `_one_reply()` in `netbox_kea/kea.py` requires one dict reply
      with an int result.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "CLAUDE.md: Validate Kea response shape before indexing resp[0]"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern: $C.command(...)[0]

  - id: kea-reservation-command-outside-adapter
    languages: [python]
    severity: ERROR
    message: >-
      Only `netbox_kea/kea.py` may send a `reservation-*` command. Its results are raw Kea Reservation
      records, whose keys only `netbox_kea/reservations.py` knows how to read. Every other module consumes the
      typed `Reservation`, `ReservationIdentity` and `ReservationScope` values those two build, so raw
      Reservation keys cannot spread back out of the private adapters.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "CONTEXT.md: Reservation, Reservation Identity, Reservation Scope"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
        - "netbox_kea/kea.py"
    patterns:
      - pattern-either:
          - pattern: $C.command(KeaCommand.$M, ...)
          - pattern: $C.command(..., command=KeaCommand.$M, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^RESERVATION_

  - id: kea-runtime-write-outside-runtime-change
    languages: [python]
    severity: ERROR
    message: >-
      A `KeaClient` runtime write primitive (`lease_add`, `lease_update`, `lease_delete`, `lease_wipe`,
      `dhcp_enable`, `dhcp_disable`) is called outside `runtime_change.py`. Send a Runtime Change through
      `runtime_change`. It reads the shown Lease before the write, classifies the reply as applied, unknown or
      a rejection, and never reads Kea after the send (ADR 0011). A direct call reads a lost reply as a
      failure, although Kea can have applied the change. Limit: the rule matches the method name, so it cannot
      see a call through an alias.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "docs/adr/0011-runtime-changes-return-a-typed-outcome.md: Guard"
    paths:
      exclude:
        - "**/tests/**"
        - "netbox_kea/runtime_change.py"
    patterns:
      - pattern: $CLIENT.$METHOD(...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(lease_add|lease_update|lease_delete|lease_wipe|dhcp_enable|dhcp_disable)$

  - id: kea-reservation-write-outside-config-write
    languages: [python]
    severity: ERROR
    message: >-
      A `KeaClient` Reservation write primitive (`reservation_add`, `reservation_update`, `reservation_del`)
      is called outside `config_write.py`. Send a Reservation write through `config_write.add_reservation()`,
      `edit_reservation()` or `delete_reservation()`. `config_write` holds the advisory lock of the Kea daemon
      from the scope read to the end of the persist step, classifies the reply as applied, unknown or a
      rejection, and verifies only an applied change (ADR 0012). A direct call takes no lock, so a concurrent
      config-set can erase it, and it reads a lost reply as a failure. Limit: the rule matches the method
      name, so it cannot see a call through an alias.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "docs/adr/0012-reservation-writes-are-configuration-changes.md"
    paths:
      exclude:
        - "**/tests/**"
        - "netbox_kea/config_write.py"
    patterns:
      - pattern: $CLIENT.$METHOD(...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(reservation_add|reservation_update|reservation_del)$

  - id: kea-config-read-modify-write-without-reader
    languages: [python]
    severity: ERROR
    message: >-
      A function that calls `config_set()` also reads `config-get` itself. Read the live configuration for a
      read-modify-write through `KeaClient.config_candidate()`. It validates the config-get reply and the
      `Dhcp4`/`Dhcp6` block before the edit reads it, and `CandidateConfiguration` validates each list the
      edit walks. A hand-parsed config-get reply turns a malformed block into an `AttributeError` and an HTTP
      500.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "CLAUDE.md: Validate Kea response shape before indexing"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
            $S.config_set(...)
      - pattern-either:
          - pattern: $C.command(KeaCommand.CONFIG_GET, ...)
          - pattern: $C.command(..., command=KeaCommand.CONFIG_GET, ...)

  - id: kea-unsupported-command-inline-check
    languages: [python]
    severity: ERROR
    message: >-
      `exc.response.get("result") == 2` (or `["result"]`) is compared outside `KeaException`. Use
      `KeaException.unsupported_command` instead. The property is the one definition of an unsupported
      command.
    metadata:
      category: maintainability
      confidence: HIGH
    paths:
      exclude:
        - "**/tests/**"
    # v2 syntax: only a negated `inside` can carry the reassignment conditions.
    match:
      all:
        - any:
            - $EXC.response.get("result") == 2
            - $EXC.response.get("result") != 2
            - $EXC.response["result"] == 2
            - $EXC.response["result"] != 2
            - all:
                - any:
                    - inside: |
                        $R = $EXC.response.get("result")
                        ...
                    - inside: |
                        $R = $EXC.response["result"]
                        ...
                # Code after a later assignment of $R sees a replaced value.
                - not:
                    inside:
                      all:
                        - |
                          $R = $OTHER
                          ...
                        - not: |
                            $R = $EXC.response.get("result")
                            ...
                        - not: |
                            $R = $EXC.response["result"]
                            ...
                        - inside:
                            any:
                              - |
                                $R = $EXC.response.get("result")
                                ...
                              - |
                                $R = $EXC.response["result"]
                                ...
                - any:
                    - $R == 2
                    - $R != 2
        - not:
            inside: |
              class KeaException(...):
                  ...

  - id: netbox-ipam-get-or-create-non-unique-key
    languages: [python]
    severity: ERROR
    message: >-
      `get_or_create()` or `update_or_create()` is called on `Prefix`, `IPRange` or `IPAddress`, directly or
      on a queryset chain such as `.filter(...)`. NetBox does not enforce these keys in the database.
      `ENFORCE_GLOBAL_UNIQUE` is checked only in `clean()`, so duplicate rows can exist, and each call then
      raises `MultipleObjectsReturned`. Query with `filter(...)` and handle more than one match explicitly
      through IPAM reconciliation. An exact `pk=` or `id=` lookup is exempt.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      exclude:
        - "**/tests/**"
    patterns:
      - pattern-either:
          - pattern: $QS.get_or_create(...)
          - pattern: $QS.update_or_create(...)
      # An exact primary-key lookup matches at most one row.
      - pattern-not: $QS.get_or_create(..., pk=$PK, ...)
      - pattern-not: $QS.get_or_create(..., id=$PK, ...)
      - pattern-not: $QS.update_or_create(..., pk=$PK, ...)
      - pattern-not: $QS.update_or_create(..., id=$PK, ...)
      # The receiver can be a queryset chain, e.g. Prefix.objects.filter(...).
      - metavariable-pattern:
          metavariable: $QS
          pattern-either:
            - pattern: <... Prefix.objects ...>
            - pattern: <... IPRange.objects ...>
            - pattern: <... IPAddress.objects ...>

  - id: kea-change-rejection-caught-outside-mapper
    languages: [python]
    severity: ERROR
    message: >-
      Do not catch `ChangeRejected` in a view. Run the change through `run_change()`, or a loop of changes
      through `run_change_loop()`, in `views/_base.py`. They are the one place that turns a Configuration
      Change or Runtime Change outcome or rejection into a message (ADR 0005, ADR 0011). A second handler
      gives the same rejection a different message. The rule exempts a function by these two names.
    metadata:
      category: maintainability
      confidence: HIGH
      references:
        - "docs/adr/0005-configuration-changes-return-a-typed-outcome.md: Presentation"
        - "docs/adr/0011-runtime-changes-return-a-typed-outcome.md: Shared types and presentation"
    paths:
      include:
        - "**/views/**"
    patterns:
      # `except (..., $EXC, ...):` also matches `except $EXC:`. With `as`, it matches only a tuple.
      - pattern-either:
          - pattern: |
              try:
                  ...
              except (..., $EXC, ...):
                  ...
          - pattern: |
              try:
                  ...
              except $EXC as $E:
                  ...
          - pattern: |
              try:
                  ...
              except (..., $EXC, ...) as $E:
                  ...
      - metavariable-pattern:
          metavariable: $EXC
          pattern-either:
            - pattern: ChangeRejected
            - pattern: $MODULE.ChangeRejected
      - pattern-not-inside: |
          def run_change(...):
              ...
      - pattern-not-inside: |
          def run_change_loop(...):
              ...
      - focus-metavariable: $EXC

  - id: kea-change-mapper-outside-base
    languages: [python]
    severity: ERROR
    message: >-
      Define `run_change` and `run_change_loop` only in `views/_base.py`. The rule
      `kea-change-rejection-caught-outside-mapper` exempts a function by these names, so a second definition
      in another view would hide its catch of `ChangeRejected`.
    metadata:
      category: maintainability
      confidence: HIGH
      references:
        - "docs/adr/0005-configuration-changes-return-a-typed-outcome.md: Presentation"
        - "docs/adr/0011-runtime-changes-return-a-typed-outcome.md: Shared types and presentation"
    paths:
      include:
        - "**/views/**"
      exclude:
        - "**/views/_base.py"
    pattern-either:
      - pattern: |
          def run_change(...):
              ...
      - pattern: |
          def run_change_loop(...):
              ...

  - id: kea-change-in-broad-except
    languages: [python]
    severity: ERROR
    message: >-
      Do not call a `config_write` or `runtime_change` operation inside a `try` whose `except` catches
      `Exception`, `BaseException`, or everything. That handler also catches `ChangeRejected` and hides it
      from `run_change()` in `views/_base.py`. Pass the call to `run_change()` or `run_change_loop()` as a
      lambda, and catch only the errors that you expect. A call passed as a lambda is exempt, because the
      mapper catches the rejection first.
    metadata:
      category: maintainability
      confidence: HIGH
      references:
        - "docs/adr/0005-configuration-changes-return-a-typed-outcome.md: Presentation"
        - "docs/adr/0011-runtime-changes-return-a-typed-outcome.md: Shared types and presentation"
    paths:
      include:
        - "**/views/**"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      try:
                          ...
                      except (..., $EXC, ...):
                          ...
                  - pattern-inside: |
                      try:
                          ...
                      except $EXC as $E:
                          ...
                  - pattern-inside: |
                      try:
                          ...
                      except (..., $EXC, ...) as $E:
                          ...
              - metavariable-pattern:
                  metavariable: $EXC
                  pattern-either:
                    - pattern: Exception
                    - pattern: BaseException
          - pattern-inside: |
              try:
                  ...
              except:
                  ...
      - pattern-either:
          - pattern: config_write.$OP(...)
          - pattern: runtime_change.$OP(...)
      # The mapper catches the rejection only when it runs the change: a lambda, not an eager call.
      - pattern-not-inside: "run_change(..., lambda: ..., ...)"
      - pattern-not-inside: "run_change_loop(..., lambda $ROW: ..., ...)"

  - id: subprocess-without-timeout
    languages: [python]
    severity: ERROR
    message: >-
      Pass `timeout=` to this `subprocess.run()`, `call()`, `check_call()` or `check_output()` call. Without a
      timeout, a child process that stops responding blocks the caller with no limit, and a test run or script
      hangs instead of failing.
    metadata:
      category: correctness
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: subprocess.run(...)
          - pattern: subprocess.call(...)
          - pattern: subprocess.check_call(...)
          - pattern: subprocess.check_output(...)
      - pattern-not: subprocess.$FUNCTION(..., timeout=$SECONDS, ...)

  - id: kea-http-call-outside-client
    languages: [python]
    severity: ERROR
    message: >-
      `requests.Session()`, `requests.get()`, `post()`, `put()`, `patch()`, `delete()`, `head()` or
      `request()` is called outside `kea.py`. Send Kea HTTP requests through `KeaClient.command()`. It applies
      the TLS settings of the Server on each request and reports a missing TLS file as `KeaTLSFileError`, a
      `RequestException`. A request sent outside it lets the environment CA bundle replace those settings, and
      a missing TLS file escapes the `RequestException` handlers of the views as a plain `OSError`. Limit: the
      rule matches the `requests.` module prefix only, so an aliased import (`from requests import post`,
      `import requests as r`) is not seen.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/**"
        - "kea-http-call-outside-client.py"
      exclude:
        - "netbox_kea/kea.py"
        - "netbox_kea/tests/**"
    pattern-either:
      - pattern: requests.Session(...)
      - pattern: requests.session(...)
      - pattern: requests.get(...)
      - pattern: requests.post(...)
      - pattern: requests.put(...)
      - pattern: requests.patch(...)
      - pattern: requests.delete(...)
      - pattern: requests.head(...)
      - pattern: requests.request(...)

  - id: kea-ip-parse-outside-module
    languages: [python]
    severity: ERROR
    message: >-
      Parse IP address and network text with `netbox_kea/ip_parse.py`. The rule matches `ip_address()`,
      `ip_network()`, `ip_interface()` and the family classes `IPv4Address` to `IPv6Interface` of `ipaddress`
      (also through an import alias), and `netaddr.IPAddress()`. `ipaddress` accepts an IPv6 scope zone
      (`fe80::1%eth0`) and keeps it in the value, and Kea and NetBox IPAM cannot use it. `ip_parse` refuses
      the zone with netaddr. An int literal (`IPv4Address(0)`) is not text, so the rule permits it. An
      `(address, length)` tuple is matched: `ipaddress` parses its address element as text. Limits: an int in
      a variable is reported, a call through another name (`parse = ipaddress.ip_address`) is not seen, and
      `netaddr.IPNetwork()` is not matched, because the IPAM writes build it from parsed values.
      `test_ip_parse.py` checks a pydantic field typed with `ipaddress`, not this rule.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/**"
        - "kea-ip-parse-outside-module.py"
      exclude:
        - "netbox_kea/ip_parse.py"
        - "netbox_kea/tests/**"
        - "netbox_kea/migrations/**"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: ipaddress.$PARSE($VALUE, ...)
                  - pattern: ipaddress.$PARSE(..., address=$VALUE, ...)
              - metavariable-regex:
                  metavariable: $PARSE
                  regex: ^(ip_address|ip_network|ip_interface|IPv4Address|IPv6Address|IPv4Network|IPv6Network|IPv4Interface|IPv6Interface)$
          - pattern: netaddr.IPAddress($VALUE, ...)
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!\d+$)

  - id: kea-mac-sync-write-without-savepoint
    languages: [python]
    severity: ERROR
    message: >-
      A MAC lookup or save in `sync_mac_address()` is outside `event_scope.atomic()`. Run the MAC lookup and
      save in `event_scope.atomic()` before you catch their errors. A failed MAC write must not abort the IPAM
      claim of the caller. The rule covers the savepoint boundary of this synchronizer, not transaction
      ownership across other callers.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/sync.py"
        - "kea-mac-sync-write-without-savepoint.py"
    patterns:
      - pattern-inside: |
          def sync_mac_address(...):
              ...
      - pattern-either:
          - pattern: dcim.models.MACAddress.objects.get_or_create(...)
          - pattern: $MAC.save(...)
      - pattern-not-inside: |
          with event_scope.atomic(...):
              ...

  - id: kea-no-event-queue-internals
    languages: [python]
    severity: ERROR
    message: >-
      Do not use the event queue internals of NetBox (`events_queue`, `EventContext`, `enqueue_event`). NetBox
      owns its event queue, and `event_scope.atomic()` uses only `event_tracking`. Open the transaction with
      `event_scope.atomic()`: NetBox then dispatches the events of a unit after its COMMIT, and none when it
      rolls back. Limit: the rule matches the names as text, so a comment that names them also matches.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/**"
        - "kea-no-event-queue-internals.py"
      exclude:
        - "**/tests/**"
    pattern-regex: \b(events_queue|EventContext|enqueue_event)\b

  - id: kea-raw-atomic
    languages: [python]
    severity: ERROR
    message: >-
      Open the transaction with `event_scope.atomic()`, not `django.db.transaction.atomic` (a call, a `with`,
      a decorator or an aliased import). The owner decides whether the block is a unit that dispatches its
      events only after its COMMIT.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/**"
        - "kea-raw-atomic.py"
      exclude:
        - "netbox_kea/event_scope.py"
        - "**/tests/**"
    pattern-either:
      - pattern: django.db.transaction.atomic
      - pattern: import django.db.transaction.atomic

  - id: kea-refusal-after-event-write
    languages: [python]
    severity: ERROR
    message: >-
      Raise the refusal before the first event-producing write of a caught `event_scope.atomic()` block. The
      rule sees a `raise` after `save()`, `delete()`, `create()`, `get_or_create()`, `update_or_create()` or
      an m2m `set()`, `add()`, `remove()` or `clear()` in such a block inside a `try`. Inside a transaction
      the block is a savepoint, and NetBox dispatches the event of a write that it rolled back. Limit: writes
      and raises inside called helpers and callbacks are not seen.
    metadata:
      category: correctness
      confidence: MEDIUM
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-inside: |
          try:
              ...
          except ...:
              ...
      - pattern-inside: |
          with event_scope.atomic(...):
              ...
      - pattern-either:
          - pattern-inside: |
              $X.save(...)
              ...
          - pattern-inside: |
              $X.delete(...)
              ...
          - pattern-inside: |
              $Q.create(...)
              ...
          - pattern-inside: |
              $Q.get_or_create(...)
              ...
          - pattern-inside: |
              $Q.update_or_create(...)
              ...
          - pattern-inside: |
              $M.set(...)
              ...
          - pattern-inside: |
              $M.add(...)
              ...
          - pattern-inside: |
              $M.remove(...)
              ...
          - pattern-inside: |
              $M.clear()
              ...
      - pattern: raise ...

  - id: kea-dispatch-error-swallowed
    languages: [python]
    severity: ERROR
    message: >-
      Add an `except event_scope.EventDispatchError:` clause before the broad handler (`Exception`,
      `BaseException` or `RuntimeError`, alone or in a tuple, or a bare `except`) of this `try`. The unit
      committed and its events did not dispatch, so the run must fail (`raise`), not report a failed row.
      After an applied change, return `"events-failed"` from a function annotated `-> SideEffectStatus` (ADR
      0012). A Manual Sync catches `ClaimEventsFailed`, which holds the claim result, before it re-raises
      every other `EventDispatchError` (ADR 0011). The one reviewed broad handler above units is the
      per-Server catch of the IPAM job in `jobs.py`, which logs the error and counts it in the job report.
      Limits: the handler order is not checked, the handler of `ClaimEventsFailed` is not checked; a `try`
      with `finally` and handlers around callers of `event_scope.atomic()` other than `claim()` and
      `reconcile()` are not seen.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-either:
          - pattern-inside: |
              try:
                  ...
              except Exception:
                  ...
          - pattern-inside: |
              try:
                  ...
              except Exception:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except Exception as $ERR:
                  ...
          - pattern-inside: |
              try:
                  ...
              except Exception as $ERR:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except BaseException:
                  ...
          - pattern-inside: |
              try:
                  ...
              except BaseException:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except BaseException as $ERR:
                  ...
          - pattern-inside: |
              try:
                  ...
              except BaseException as $ERR:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., Exception, ...):
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., Exception, ...):
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., Exception, ...) as $ERR:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., Exception, ...) as $ERR:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., BaseException, ...):
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., BaseException, ...):
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., BaseException, ...) as $ERR:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., BaseException, ...) as $ERR:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except RuntimeError:
                  ...
          - pattern-inside: |
              try:
                  ...
              except RuntimeError:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except RuntimeError as $ERR:
                  ...
          - pattern-inside: |
              try:
                  ...
              except RuntimeError as $ERR:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., RuntimeError, ...):
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., RuntimeError, ...):
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., RuntimeError, ...) as $ERR:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., RuntimeError, ...) as $ERR:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except:
                  ...
          - pattern-inside: |
              try:
                  ...
              except:
                  ...
              else:
                  ...
      - pattern-not-inside: |
          try:
              ...
          except event_scope.EventDispatchError:
              raise
      - pattern-not-inside: |
          try:
              ...
          except event_scope.EventDispatchError:
              raise
          else:
              ...
      - pattern-not-inside: |
          try:
              ...
          except event_scope.EventDispatchError:
              raise
          finally:
              ...
      # A committed-event fact must be explicit. A generic failure or an untyped string still fails.
      - pattern-either:
          - patterns:
              - pattern: $CALL(...)
              - pattern-not-inside: |
                  def $FUNCTION(...) -> SideEffectStatus:
                      ...
          - patterns:
              - pattern: $CALL(...)
              - pattern-not-inside: |
                  try:
                      ...
                  except event_scope.EventDispatchError:
                      ...
                      return "events-failed"
      - pattern-either:
          - pattern: event_scope.atomic(...)
          # Each claim and reconciliation row is an event_scope unit inside the call.
          - pattern: claim(...)
          - pattern: reconcile(...)

  - id: netbox-ipam-mutation-outside-reconciliation
    languages: [python]
    severity: ERROR
    message: >-
      Delete `IPAddress`, `Prefix` and `IPRange` rows and change their status only in
      `netbox_kea/ipam_reconciliation.py`. Reconciliation checks ownership and the upgrade barrier before it
      changes or removes an IPAM row. The rule covers direct queryset chains, local query bindings and typed
      helper parameters, also through import aliases.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      exclude:
        - "netbox_kea/ipam_reconciliation.py"
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-either:
          - pattern: $OBJ.delete(...)
          - pattern: $OBJ.update(..., status=$STATUS, ...)
          - pattern: $OBJ.status = $STATUS
      - pattern-either:
          # Direct manager and queryset chains, including imported model aliases.
          - patterns:
              - pattern: $OBJ.$MEMBER
              - metavariable-pattern:
                  metavariable: $OBJ
                  pattern-either:
                    - pattern: <... ipam.models.IPAddress.objects ...>
                    - pattern: <... ipam.models.Prefix.objects ...>
                    - pattern: <... ipam.models.IPRange.objects ...>
          # A local variable bound to an IPAM query or object lookup.
          - patterns:
              - pattern-inside: |
                  $OBJ = $QUERY
                  ...
              - metavariable-pattern:
                  metavariable: $QUERY
                  pattern-either:
                    - pattern: <... ipam.models.IPAddress.objects ...>
                    - pattern: <... ipam.models.Prefix.objects ...>
                    - pattern: <... ipam.models.IPRange.objects ...>
                    - pattern: ipam.models.IPAddress(...)
                    - pattern: ipam.models.Prefix(...)
                    - pattern: ipam.models.IPRange(...)
          # Typed helper parameters, even when the import is under TYPE_CHECKING.
          - patterns:
              - pattern-inside: |
                  def $FUNCTION(..., $OBJ: $TYPE, ...):
                      ...
              - metavariable-pattern:
                  metavariable: $TYPE
                  pattern-either:
                    - pattern: ipam.models.IPAddress
                    - pattern: ipam.models.Prefix
                    - pattern: ipam.models.IPRange

  - id: kea-request-number-without-ascii-check
    languages: [python]
    severity: ERROR
    message: >-
      Parse a number from request text with `parse_decimal()` from `netbox_kea.decimal_text`. The rule sees
      `str.isdigit()`, `isdecimal()` or `isnumeric()`, a `\d` in an `re` pattern, and `int()` of a request
      value: `request.GET`, `POST`, `query_params` or `data`, a `params` mapping, or form `cleaned_data`,
      directly or through a local variable. These also accept other Unicode digits, so `?subnet_id=١٢` reads
      Subnet 12, and `int()` also accepts surrounding whitespace. Limit: a value passed to another function as
      a parameter is not followed.
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    pattern-either:
      - pattern: $TEXT.isdigit()
      - pattern: $TEXT.isdecimal()
      - pattern: $TEXT.isnumeric()
      - patterns:
          - pattern-either:
              - pattern: re.$FUNCTION("$REGEX", ...)
              - pattern: re.$FUNCTION(r"$REGEX", ...)
          - metavariable-regex:
              metavariable: $REGEX
              regex: \\d
      - patterns:
          - pattern-either:
              - pattern: int($PARAMS.get(...))
              - pattern: int($PARAMS[...])
              - pattern: int(<... $PARAMS.getlist(...) ...>)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $VALUE = $PARAMS.get(...)
                          ...
                      - pattern-inside: |
                          $VALUE = $PARAMS[...]
                          ...
                  - pattern: int($VALUE)
          - metavariable-regex:
              metavariable: $PARAMS
              regex: ^((self\.)?request\.(GET|POST|query_params|data)|params|query_params|(self\.)?cleaned_data)$

  - id: kea-snapshot-notice-outside-notice-module
    languages: [python]
    severity: ERROR
    message: >-
      Do not read `.diagnostics` or choose `messages.ERROR` or `messages.WARNING` in a view. Pass the Snapshot
      to `notice()`, or run a raised Reservation or Lease read through `load_snapshot()`, in
      `views/notices.py`, and show the Notice through `show_notices()`, a template or `ServerNotices`. One
      function there codes the Presentation rule of ADR 0003 for every Snapshot; a view that picks a level by
      hand codes the rule again, and the copies drift. Exempt: the change outcome in `run_change()`,
      `_rejection_message()`, `_unconfirmed_message()` and `persistence_failure()`, the lease export refusal
      in `_incomplete_export_message()`, and a function that parses a Reservation Transfer Document. Limits:
      an alias (a messages constant imported by name, or the diagnostics of a variable passed to a helper
      outside `views/`) and templates are not seen. A `messages.error()` or `messages.warning()` call is not
      seen either, because non-Snapshot messages use these calls correctly.
    metadata:
      category: maintainability
      confidence: HIGH
      references:
        - "docs/adr/0003-separate-server-configuration-authority.md: Presentation"
    paths:
      include:
        - "**/views/**"
      exclude:
        - "**/views/notices.py"
    patterns:
      - pattern-either:
          - pattern: $VALUE.diagnostics
          - pattern: messages.ERROR
          - pattern: messages.WARNING
      # A change outcome or rejection, not a Snapshot (ADR 0005, ADR 0011).
      - pattern-not-inside: |
          def run_change(...):
              ...
      - pattern-not-inside: |
          def _rejection_message(...):
              ...
      - pattern-not-inside: |
          def _unconfirmed_message(...):
              ...
      - pattern-not-inside: |
          def persistence_failure(...):
              ...
      # A complete export refuses an incomplete Lease Snapshot; the message names the excluded records.
      - pattern-not-inside: |
          def _incomplete_export_message(...):
              ...
      # A Reservation Transfer Document is not a Snapshot.
      - pattern-not-inside: |
          def $FUNC(...):
              ...
              <... parse_reservation_document(...) ...>
              ...

  - id: kea-snapshot-read-without-notice
    languages: [python]
    severity: ERROR
    message: >-
      This view function reads a Catalogue, Server Configuration, Reservation or Lease Snapshot (directly,
      through a named read helper, or through `executor.submit()`), but it calls none of `notice()`,
      `failed_load()` and `load_snapshot()` from `views/notices.py`. A Reservation read is a
      `reservation_reads` read (`cached_page()` or a `read_*()` function). The page then does not show an
      unavailable or incomplete Snapshot (ADR 0003, Presentation). Pass the Snapshot to `notice()` (or to
      `failed_load()` when a load cannot go on), or run a raised Reservation or Lease read through
      `load_snapshot()`, and show the Notice. Exempt by name: the DDNS suffix read of a hostname preview.
      Limits: a read through a helper that this rule does not name, a read function passed by reference other
      than to `executor.submit()`, an aliased import, and a Notice made in a called helper are not seen.
      `test_snapshot_notice_sweep.py` covers the pages at run time.
    metadata:
      category: correctness
      confidence: MEDIUM
      references:
        - "docs/adr/0003-separate-server-configuration-authority.md: Presentation"
    paths:
      include:
        - "**/views/**"
      exclude:
        - "**/views/notices.py"
    patterns:
      - pattern-inside: |
          def $FUNC(...):
              ...
      - pattern-either:
          - pattern: subnet_catalogue.display(...)
          - pattern: server_configuration.display(...)
          - pattern: server_configuration.for_verification(...)
          - pattern: $CLIENT.reservation_page(...)
          - pattern: $CLIENT.reservation_snapshot(...)
          - pattern: $CLIENT.lease_search(...)
          - pattern: $CLIENT.lease_get_page(...)
          - pattern: $CLIENT.lease_get_all(...)
          - patterns:
              - pattern: reservation_reads.$READ(...)
              - metavariable-regex:
                  metavariable: $READ
                  regex: ^(cached_page|read_\w+)$
          - pattern: read_leases(...)
          - patterns:
              - pattern: $EXECUTOR.submit($READ, ...)
              - metavariable-pattern:
                  metavariable: $READ
                  pattern-either:
                    - pattern: subnet_catalogue.display
                    - pattern: server_configuration.display
      - pattern-not-inside: |
          def $FUNC(...):
              ...
              <... notice(...) ...>
              ...
      - pattern-not-inside: |
          def $FUNC(...):
              ...
              <... load_snapshot(...) ...>
              ...
      - pattern-not-inside: |
          def $FUNC(...):
              ...
              <... failed_load(...) ...>
              ...
      # The DDNS suffix of a hostname preview.
      - pattern-not-inside: |
          def _published_name_preview(...):
              ...

  - id: kea-view-read-ladder
    languages: [python]
    severity: ERROR
    message: >-
      This code catches a failed Kea read itself: an `except` names `KeaException`,
      `requests.RequestException`, the malformed reply base `MalformedKeaReply` or `KeaClientSettingsError`,
      alone or in a tuple. `read_failure.attempt()` is the one classifier of a failed read (ADR 0015). It
      returns a `ReadFailure` with the kind (unsupported, refused, unreachable, malformed, misconfigured), and
      it logs the failure. Run the read through `attempt()`, or through `load_snapshot()` or `load_target()`
      in a view, and map the kind to the presentation of the caller. Exempt by name: the write classification
      of ADR 0005 and ADR 0011 (`change_outcome.mutate` and `config_write._test_before`). Limits: an `except`
      of `Exception`, of a subclass such as `requests.ConnectionError` or `MalformedReply`, or of an aliased
      import is not seen.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "docs/adr/0015-kea-read-failures-are-classified-outside-keaclient-by-one-module.md"
        - "docs/adr/0011-runtime-changes-return-a-typed-outcome.md: Application"
    paths:
      include:
        - "netbox_kea/**"
        - "kea-view-read-ladder.py"
      exclude:
        - "netbox_kea/read_failure.py"
        - "netbox_kea/kea.py"
        # A test drives these failures and asserts on them.
        - "netbox_kea/tests/**"
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except KeaException:
                  ...
          - pattern: |
              try:
                  ...
              except KeaException as $E:
                  ...
          - pattern: |
              try:
                  ...
              except (..., KeaException, ...):
                  ...
          - pattern: |
              try:
                  ...
              except (..., KeaException, ...) as $E:
                  ...
          - pattern: |
              try:
                  ...
              except requests.RequestException:
                  ...
          - pattern: |
              try:
                  ...
              except requests.RequestException as $E:
                  ...
          - pattern: |
              try:
                  ...
              except (..., requests.RequestException, ...):
                  ...
          - pattern: |
              try:
                  ...
              except (..., requests.RequestException, ...) as $E:
                  ...
          - pattern: |
              try:
                  ...
              except MalformedKeaReply:
                  ...
          - pattern: |
              try:
                  ...
              except MalformedKeaReply as $E:
                  ...
          - pattern: |
              try:
                  ...
              except (..., MalformedKeaReply, ...):
                  ...
          - pattern: |
              try:
                  ...
              except (..., MalformedKeaReply, ...) as $E:
                  ...
          - pattern: |
              try:
                  ...
              except KeaClientSettingsError:
                  ...
          - pattern: |
              try:
                  ...
              except KeaClientSettingsError as $E:
                  ...
          - pattern: |
              try:
                  ...
              except (..., KeaClientSettingsError, ...):
                  ...
          - pattern: |
              try:
                  ...
              except (..., KeaClientSettingsError, ...) as $E:
                  ...
      # A change classifies a failed send as applied, unknown or rejected (ADR 0005, ADR 0011), not as a read.
      - pattern-not-inside: |
          def mutate(...):
              ...
      # config-test is a step of a Configuration Change: result 2 skips it, and a forward failure is not a refusal.
      - pattern-not-inside: |
          def _test_before(...):
              ...

  - id: kea-catalogue-absence-without-consistency
    languages: [python]
    severity: ERROR
    message: >-
      A Subnet Catalogue whose identity and configuration facts disagree omits each disputed Subnet, so a
      complete configuration alone (`not <catalogue>.configuration_complete`) does not show that a CIDR or an
      address is absent from Kea. Read `configuration_confirms_absence`, which also needs `consistent`. Limit:
      the rule sees the negated attribute read only.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "**/views/**"
        - "**/subnet_catalogue.py"
    pattern: not $CATALOGUE.configuration_complete

  - id: kea-cache-outside-display-cache
    languages: [python]
    severity: ERROR
    message: >-
      Reach the Django cache through `netbox_kea/display_cache.py` only. It owns every key, the configuration
      and records generations, the TTLs of the Display Cache settings and the admission rule (ADR 0009). A key
      built in another module has none of the generations, so a Kea write or a settings save cannot make it
      unreachable. The rule sees `django.core.cache` (`cache`, `caches`, `import django.core.cache`, `from
      django.core import cache`, or an import from it), and a private name of `display_cache`: an absolute or
      relative import of the name (`from .display_cache import _generation`, also in parentheses), or an
      attribute of the module (`display_cache._generation`, also through `from . import display_cache as x`).
      Limits: another cache library, `getattr()`, a re-export, and a cache reached through a helper outside
      `netbox_kea/` are not seen.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/**"
        - "kea-cache-outside-display-cache.py"
      exclude:
        - "netbox_kea/display_cache.py"
        - "**/tests/**"
    pattern-either:
      - pattern: django.core.cache.cache
      - pattern: django.core.cache.caches
      - pattern: import django.core.cache
      - pattern: from django.core import cache
      - pattern: from django.core.cache import $NAME
      # A private name imported from the module, absolute or relative, also inside parentheses.
      - pattern-regex: from\s+(?:\.+|netbox_kea\.)display_cache\s+import\s+(?:\([^)]*?|[^\n]*?)\b_\w
      - patterns:
          - pattern-either:
              - pattern: netbox_kea.display_cache.$NAME
              - pattern: display_cache.$NAME
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          from . import display_cache as $ALIAS
                          ...
                      - pattern-inside: |
                          from .. import display_cache as $ALIAS
                          ...
                  - pattern: $ALIAS.$NAME
          - metavariable-regex:
              metavariable: $NAME
              regex: ^_

  - id: kea-private-name-import
    languages: [python]
    severity: ERROR
    message: >-
      Do not import a private name (a name that starts with one `_`) from another `netbox_kea` module in
      production code. A private name can change without notice, so a caller that uses it breaks. Make the name
      public in its module. The rule sees `from netbox_kea... import _x` and a relative `from .x import _x`, also
      inside parentheses and with `as`. Allowed: a dunder name such as `__version__`, and `from . import _x`,
      which imports a private module of the same package. Limits: the tests, an attribute read of a private name
      through a module, `getattr()` and a re-export are not seen. Ruff `PLC2701` does not replace the rule,
      because it does not check imports inside the package.
    metadata:
      category: maintainability
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/**"
        - "kea-private-name-import.py"
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-either:
          - pattern: from $MODULE import $NAME
          - pattern: from $MODULE import $NAME as $ALIAS
      - metavariable-regex:
          metavariable: $MODULE
          regex: ^(\.[.\w]*\w|netbox_kea(\.\w+)*)$
      - metavariable-regex:
          metavariable: $NAME
          regex: ^_(?!_)

  - id: kea-server-permission-outside-server-scope
    languages: [python]
    severity: ERROR
    message: >-
      Read a Server permission only in `netbox_kea/views/server_scope.py` (ADR 0016). A Server view inherits
      `ServerAccessMixin` and reads `self.server` and `self.access.can_change`; other code gets the permitted
      Servers from `permitted_servers()`, and a combined page from `writable_servers()`. The rule sees
      `Server.objects.restrict(...)` (also through a module), `get_object_or_404(Server...)` and
      `has_perm("netbox_kea.<x>_server", ...)`, also with `perm=`, in production code. Allowed: the custom
      `has_perm("netbox_kea.bulk_delete_lease_from_server", obj=...)` check of a Lease delete. Limits: a queryset
      of another name, `has_perms()`, a permission name built at run time and NetBox's generic views are not seen.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/**"
        - "kea-server-permission-outside-server-scope.py"
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
        - "netbox_kea/views/server_scope.py"
    pattern-either:
      - pattern: Server.objects.restrict(...)
      - pattern: $MODULE.Server.objects.restrict(...)
      - patterns:
          - pattern: get_object_or_404($QUERYSET, ...)
          - metavariable-regex:
              metavariable: $QUERYSET
              regex: ^(\w+\.)*Server\b
      - patterns:
          - pattern-either:
              - pattern: $USER.has_perm($PERMISSION, ...)
              - pattern: $USER.has_perm(..., perm=$PERMISSION, ...)
          - metavariable-regex:
              metavariable: $PERMISSION
              regex: ^["']netbox_kea\.\w+_server["']$
          - pattern-not: $USER.has_perm("netbox_kea.bulk_delete_lease_from_server", obj=$OBJECT)
          - pattern-not: $USER.has_perm(perm="netbox_kea.bulk_delete_lease_from_server", obj=$OBJECT)

  - id: kea-ownership-read-without-database-error
    languages: [python]
    severity: ERROR
    message: >-
      A view reads the IPAM Ownership with `address_ownership()` or `prefix_ownership()` outside a `try` that
      catches `DatabaseError` (alone or in a tuple). The read only feeds a badge or an advisory, so a failed
      read must show the unknown state or no advisory, not a 500 reply. Catch `DatabaseError`, log it, and
      degrade as the Reservation and Lease pages and Row Sync do. Limits: a call inside an `except` or
      `finally` block of such a `try`, an aliased import and a call through a helper are not seen.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "**/views/**"
    patterns:
      - pattern-either:
          - pattern: address_ownership(...)
          - pattern: prefix_ownership(...)
      - pattern-not-inside: |
          try:
              ...
          except DatabaseError:
              ...
      - pattern-not-inside: |
          try:
              ...
          except (..., DatabaseError, ...):
              ...

  - id: kea-option-path-outside-planned-options
    languages: [python]
    severity: ERROR
    message: >-
      The DHCP Import names a DHCP Option of a planned object with `PlannedOptions.paths()`. A keyed Option
      takes the path of its `OptionKey`, which a later run also uses when it removes the Option;
      `kea_paths.option()` takes the code, else the name, so one Kea option gets two paths in the stored run
      results. Pass the `planned_options()` of the object and use its paths. A call inside the
      `PlannedOptions` class is exempt. Limits: the rule sees `kea_paths.option()` in
      `netbox_kea/integrations/`; an import of the function by name and a call through
      a helper are not seen. The parse step (`mappers/`) runs before the definitions are known and keeps the
      literal path.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/integrations/**"
        - "kea-option-path-outside-planned-options.py"
      exclude:
        - "**/tests/**"
    patterns:
      - pattern: kea_paths.option(...)
      - pattern-not-inside: |
          class PlannedOptions:
              ...

  - id: kea-object-path-outside-key
    languages: [python]
    severity: ERROR
    message: >-
      The DHCP Import names a planned or mapped object by the path of its key (`key.path(family)`, or
      `MappingSource.path` for a stored source). A run names an object by this one path when it creates it and
      when it removes it; a path that a writer renders again can differ from it. Use the key of the planned
      object. Limits: the rule sees `kea_paths.subnet()`, `pool()`, `pd_pool()`, `reservation()`,
      `client_class()`, `shared_network()` and `option_definition()` in `netbox_kea/integrations/`, outside a
      `path(self, family)` method; an import of a function by name and a call through a helper are not seen.
      The parse step (`mappers/`) keeps its literal paths.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/integrations/**"
        - "kea-object-path-outside-key.py"
      exclude:
        - "**/tests/**"
    patterns:
      - pattern-either:
          - pattern: kea_paths.subnet(...)
          - pattern: kea_paths.pool(...)
          - pattern: kea_paths.pd_pool(...)
          - pattern: kea_paths.reservation(...)
          - pattern: kea_paths.client_class(...)
          - pattern: kea_paths.shared_network(...)
          - pattern: kea_paths.option_definition(...)
      - pattern-not-inside: |
          def path(self, $FAMILY, ...):
              ...

  - id: kea-dhcp-row-write-outside-protocol
    languages: [python]
    severity: ERROR
    message: >-
      Write an imported DHCP plugin row through `dhcp_import_write.write_row()` with a `RowAdapter` of its
      kind. The protocol finds or adopts the row, writes it, observes its DHCP Import Mapping, reports a
      failed write in one failure table (a `ValidationError` gives the messages of the plugin), and skips the
      planned subtree of an object that it does not write. A writer with its own `observe_mapping()` or its
      own `except event_scope.EventDispatchError: raise` and `except ManagedFieldsMismatch: raise` pair
      repeats that protocol and drifts from it. Only the DHCPServer, the root of a run, writes itself:
      `upsert_dhcp_server()` and `apply_global_settings()` are exempt by name. Limits: the rule sees
      `netbox_kea/integrations/`; a writer that bypasses the protocol without calling `observe_mapping()` or
      opening the re-raise pair is not caught, and a call through a module attribute or an aliased import is
      not seen. The pair matches in this handler order only: `EventDispatchError`, then
      `ManagedFieldsMismatch`. The exemptions go by function name, so another function of the same name is
      exempt too. A lone `except event_scope.EventDispatchError: raise` (the Subnet ID moves, the delegated
      Prefix attachment, the stale removal) is not the pair.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/integrations/**"
        - "kea-dhcp-row-write-outside-protocol.py"
      exclude:
        - "netbox_kea/integrations/dhcp_import_write.py"
        - "**/tests/**"
    patterns:
      - pattern-either:
          - pattern: observe_mapping(...)
          - pattern: |
              try:
                  ...
              except event_scope.EventDispatchError:
                  raise
              except ManagedFieldsMismatch:
                  raise
      - pattern-not-inside: |
          def upsert_dhcp_server(...):
              ...
      - pattern-not-inside: |
          def apply_global_settings(...):
              ...

  - id: kea-ownership-source-literal
    languages: [python]
    severity: ERROR
    message: >-
      An IPAM Ownership source is compared with a string literal. Compare it with a constant of
      `netbox_kea/ipam_sources.py`, or read the per-source fact from its `SOURCES` row, so the source table
      stays the one place that knows each source. Limits: the rule matches only a name or an attribute called
      `source`, compared by `==`, `!=` or (`not`) `in` a literal tuple, list or set. A literal in another
      collection (`"pool" in sources`), a renamed variable and a literal key of a mapping are not seen.
    metadata:
      category: maintainability
      confidence: HIGH
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-either:
          - pattern: $S == "..."
          - pattern: '"..." == $S'
          - pattern: $S != "..."
          - pattern: '"..." != $S'
          - pattern: $S in (..., "...", ...)
          - pattern: $S in [..., "...", ...]
          - pattern: $S in {..., "...", ...}
          - pattern: $S not in (..., "...", ...)
          - pattern: $S not in [..., "...", ...]
          - pattern: $S not in {..., "...", ...}
      - metavariable-regex:
          metavariable: $S
          regex: ^([\w.]+\.)?source$

  - id: kea-dhcp-mapping-query-outside-store
    languages: [python]
    severity: ERROR
    message: >-
      Read and write DHCP Import Mappings through `netbox_kea/integrations/dhcp_import_mappings.py`, the
      Mapping store. It holds every `KeaDhcpLink` query of the DHCP Import, so each lookup of a source goes
      through its unique index (`exact_source`) and each write takes the mapping lock of ADR 0008. Add a
      function there and call it. Exempt: the ADR 0008 coordination in `dhcp_mapping_lifecycle.py`,
      `models.py`, the REST API, GraphQL, the migrations and the tests. Limits: the rule sees
      `KeaDhcpLink.objects`, `KeaDhcpLink._base_manager` and a `KeaDhcpLink(...)` call by that name. An alias
      of the class, a model from `apps.get_model()`, a related manager (`server.dhcp_plugin_links`) and a raw
      SQL query are not seen.
    metadata:
      category: maintainability
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/**"
        - "kea-dhcp-mapping-query-outside-store.py"
      exclude:
        - "netbox_kea/integrations/dhcp_import_mappings.py"
        - "netbox_kea/dhcp_mapping_lifecycle.py"
        - "netbox_kea/models.py"
        - "netbox_kea/api/**"
        - "netbox_kea/graphql.py"
        - "**/migrations/**"
        - "**/tests/**"
    pattern-either:
      - pattern: KeaDhcpLink.objects
      - pattern: KeaDhcpLink._base_manager
      - pattern: KeaDhcpLink(...)
