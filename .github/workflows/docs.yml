---
name: Docs

# Deploys the site of one release tag, so the site always shows the latest release. release.yml calls it after a
# release. Dispatch it from main with a tag to deploy that release again; the github-pages environment accepts main only.
"on":
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and deploy, for example v3.2.0.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and deploy, for example v3.2.0.
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/docs-build.yml
    with:
      # The full tag ref, so a branch name fails the checkout.
      ref: refs/tags/${{ inputs.tag }}
      upload-pages: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One deployment at a time. A queued run waits, so a deployment that started always finishes.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
